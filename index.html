<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c1c1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuner">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tuner</title>
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.72);--text:#111114;--sub:#6e6e73;--line:rgba(0,0,0,.1);--accent:#007aff;
--face:radial-gradient(ellipse at 50% 100%,#fffaf0,#f6ecd0 60%,#e6d8ae);--ink:#3a2f1c;--bz1:#8d8d92;--bz2:#2b2b2e;
--red:#d9412b;--amber:#e8a317;--green:#2fa84f;--btn:linear-gradient(#fff,#e9e9ee);--btnsh:0 2px 5px rgba(0,0,0,.22),inset 0 1px 0 #fff;--sheet:rgba(250,250,252,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:rgba(44,44,46,.6);--text:#fff;--sub:#98989f;--line:rgba(255,255,255,.14);
--face:radial-gradient(ellipse at 50% 105%,#ffd98a,#f0a032 50%,#a85a08);--ink:#2a1500;--bz1:#555;--bz2:#0b0b0b;--btn:linear-gradient(#3a3a3c,#262628);--btnsh:0 2px 5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14);--sheet:rgba(28,28,30,.9)}}
:root[data-theme="dark"]{--bg:#000;--card:rgba(44,44,46,.6);--text:#fff;--sub:#98989f;--line:rgba(255,255,255,.14);
--face:radial-gradient(ellipse at 50% 105%,#ffd98a,#f0a032 50%,#a85a08);--ink:#2a1500;--bz1:#555;--bz2:#0b0b0b;--btn:linear-gradient(#3a3a3c,#262628);--btnsh:0 2px 5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14);--sheet:rgba(28,28,30,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 16px 14px;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.seg{position:relative;flex:1;display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/5);border-radius:10px;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;flex:1;min-height:40px;font-size:12.5px;font-weight:600;padding:0 2px;white-space:nowrap}
.gear{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.meter{width:100%;max-width:420px;margin:0 auto;padding:10px;border-radius:28px 28px 22px 22px;background:linear-gradient(145deg,var(--bz1),var(--bz2) 55%,var(--bz1));box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.3)}
.face{position:relative;border-radius:20px 20px 14px 14px;overflow:hidden;background:var(--face);box-shadow:inset 0 3px 12px rgba(0,0,0,.45);aspect-ratio:340/215}
.face::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,90,40,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,90,40,.03) 0 1px,transparent 1px 4px)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.12) 38%,transparent 39%),radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.3),transparent 55%)}
.face svg{position:absolute;inset:0;width:100%;height:100%;fill:none;color:var(--ink)}
.face text{fill:var(--ink);font-family:Georgia,"Times New Roman",serif}
.led{display:block;width:16px;height:16px;border-radius:50%;margin:12px auto 0;background:#4a5a4d;box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 3px var(--line);transition:background .2s,box-shadow .2s}
.led.on{background:#46ff7a;box-shadow:0 0 14px 5px rgba(70,255,122,.7),0 0 0 3px var(--line);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px 9px rgba(70,255,122,.9),0 0 0 3px var(--line)}}
.read{text-align:center;flex:0 0 auto}
.note{font-size:84px;font-weight:700;letter-spacing:-2px;line-height:1;transition:opacity .2s}
.note small{font-size:32px;font-weight:600;letter-spacing:0;color:var(--sub);vertical-align:baseline;margin-left:3px}
.note.idle{opacity:.35}
.stat{margin-top:6px;font-size:19px;font-weight:600;min-height:25px;color:var(--sub)}
.stat.ok{color:var(--green)}.stat.warn{color:var(--amber)}.stat.bad{color:var(--red)}
.nums{margin-top:2px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.strings{display:flex;justify-content:center;gap:10px;margin-top:auto;padding:8px 0 4px;flex-wrap:wrap}
.strings .hint{color:var(--sub);font-size:14px;padding:18px 0}
.sb{position:relative;width:58px;height:58px;border-radius:50%;background:var(--btn);box-shadow:var(--btnsh);font-size:20px;font-weight:700;transition:transform .15s,box-shadow .15s}
.sb sub{font-size:11px;font-weight:600;color:var(--sub);vertical-align:baseline}
.sb:active{transform:scale(.94)}
.sb.det{box-shadow:var(--btnsh),0 0 0 3px var(--accent)}
.sb.lock{box-shadow:var(--btnsh),0 0 0 3px var(--amber)}
.sb.done::after{content:"✓";position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;line-height:22px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:var(--bg);padding-top:max(32px,env(safe-area-inset-top,0px))}
.ov.hide{display:none}
.ov h1{margin:0;font-size:30px}
.ov p{margin:0;color:var(--sub);max-width:320px}
.ov p.err{color:var(--red)}
.go{min-width:200px;min-height:56px;border-radius:18px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;padding:0 28px}
.back{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.back.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;background:var(--sheet);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 6px;font-size:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;border-bottom:1px solid var(--line)}
.row:last-of-type{border:0}
.row .l small{display:block;color:var(--sub);font-size:13px}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.35);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.ref{padding:12px 0;border-bottom:1px solid var(--line)}
.ref .h{display:flex;justify-content:space-between;margin-bottom:8px}
.ref input{width:100%;height:32px;accent-color:var(--accent)}
.done-btn{width:100%;min-height:50px;margin-top:10px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="seg" id="seg"><div class="th" id="th"></div></div>
    <button class="gear" id="gear" aria-label="Settings">⚙︎</button>
  </div>
  <div class="meter"><div class="face"><svg id="svg" viewBox="0 0 340 215"></svg></div><i class="led" id="led"></i></div>
  <div class="read">
    <div class="note idle" id="note">—</div>
    <div class="stat" id="stat">Listening…</div>
    <div class="nums" id="nums">&nbsp;</div>
  </div>
  <div class="strings" id="strings"></div>
</div>

<div class="ov" id="ov">
  <h1>Tuner</h1>
  <p id="ovp">Tap to start and allow microphone access. Audio never leaves your phone.</p>
  <button class="go" id="go">Tap to start</button>
</div>

<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings">
  <div class="grab"></div><h2>Settings</h2>
  <div class="ref"><div class="h"><span>Reference pitch (A4)</span><b id="a4v">440 Hz</b></div><input type="range" id="a4" min="415" max="466" step="1" value="440"></div>
  <div class="row"><div class="l">Auto-detect string<small>Pick the closest string for you</small></div><button class="sw on" id="swAuto" role="switch"></button></div>
  <div class="row"><div class="l">Vibrate when in tune<small>If your device supports it</small></div><button class="sw on" id="swVib" role="switch"></button></div>
  <button class="done-btn" id="close">Done</button>
</div>

<script>
(function(){
"use strict";
var NN=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
var INS=[
 {n:"Guitar",s:[40,45,50,55,59,64]},
 {n:"Bass",s:[28,33,38,43]},
 {n:"Bass 5",s:[23,28,33,38,43]},
 {n:"Ukulele",s:[67,60,64,69]},
 {n:"Chromatic",s:null}
];
var S={a4:440,auto:true,vib:true,ins:0,lock:null};
try{var sv=JSON.parse(localStorage.getItem("tuner")||"{}");for(var k in sv)if(k in S&&k!=="lock")S[k]=sv[k];}catch(e){}
function save(){try{localStorage.setItem("tuner",JSON.stringify({a4:S.a4,auto:S.auto,vib:S.vib,ins:S.ins}));}catch(e){}}
var $=function(i){return document.getElementById(i)};
var tuned={};

/* ---------- gauge ---------- */
var CX=170,CY=190,AM=48,NS="http://www.w3.org/2000/svg";
function pt(r,c){var a=c/50*AM*Math.PI/180;return[CX+r*Math.sin(a),CY-r*Math.cos(a)];}
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||$("svg")).appendChild(e);return e;}
function band(a,b,col){var p=pt(100,a),q=pt(100,b);mk("path",{d:"M"+p[0]+" "+p[1]+"A100 100 0 0 1 "+q[0]+" "+q[1],stroke:col,"stroke-width":7,opacity:.9});}
band(-50,-15,"var(--red)");band(-15,-5,"var(--amber)");band(-5,5,"var(--green)");band(5,15,"var(--amber)");band(15,50,"var(--red)");
for(var c=-50;c<=50;c++){var len=c%25===0?(c===0?24:16):c%5===0?10:5,w=c===0?3.2:c%25===0?1.8:c%5===0?1.2:.7;
 var p1=pt(130,c),p2=pt(130-len,c);mk("line",{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:"currentColor","stroke-width":w,"stroke-linecap":"round"});}
[-50,-25,0,25,50].forEach(function(c){var p=pt(143,c),t=mk("text",{x:p[0],y:p[1]+3,"text-anchor":"middle","font-size":10,"font-style":"italic"});t.textContent=c>0?"+"+c:c;});
var fl=mk("text",{x:30,y:150,"text-anchor":"middle","font-size":34});fl.textContent="♭";
var sh=mk("text",{x:310,y:150,"text-anchor":"middle","font-size":34});sh.textContent="♯";
var ct=mk("text",{x:CX,y:168,"text-anchor":"middle","font-size":10,"font-style":"italic",opacity:.7});ct.textContent="cents";
var nd=mk("g",{style:"filter:drop-shadow(2px 4px 2.5px rgba(0,0,0,.4))"});
mk("line",{x1:0,y1:18,x2:0,y2:-138,stroke:"#ee4b1f","stroke-width":2,"stroke-linecap":"round"},nd);
mk("circle",{cx:0,cy:0,r:9,fill:"#2a2a2c",stroke:"#555","stroke-width":1.5},nd);
mk("circle",{cx:-2,cy:-2,r:2.5,fill:"#777"},nd);

/* spring physics */
var pos=0,vel=0,tgt=0,lt=0;
function frame(t){
 var dt=Math.min(.04,(t-lt)/1000||.016);lt=t;
 var K=140,Cd=13;vel+=(K*(tgt-pos)-Cd*vel)*dt;pos+=vel*dt;
 nd.setAttribute("transform","translate("+CX+" "+CY+") rotate("+pos.toFixed(3)+")");
 detectTick(t);requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
var seg=$("seg");
INS.forEach(function(it,i){var b=document.createElement("button");b.textContent=it.n;b.onclick=function(){setIns(i)};seg.appendChild(b);});
function setIns(i){S.ins=i;S.lock=null;tuned={};$("th").style.transform="translateX("+(i*100)+"%)";buildStrings();idle();save();}
function mname(m){return NN[m%12]+"<sub>"+(Math.floor(m/12)-1)+"</sub>";}
function buildStrings(){
 var box=$("strings");box.innerHTML="";var it=INS[S.ins];
 if(!it.s){box.innerHTML='<div class="hint">Play any note and the tuner finds it.</div>';return;}
 it.s.forEach(function(m,i){var b=document.createElement("button");b.className="sb";b.id="sb"+i;b.innerHTML=mname(m);
  b.setAttribute("aria-label","String "+NN[m%12]);
  b.onclick=function(){S.lock=S.lock===i?null:i;paintStrings(-1);};box.appendChild(b);});
}
function paintStrings(det){
 var it=INS[S.ins];if(!it.s)return;
 it.s.forEach(function(m,i){var b=$("sb"+i);if(!b)return;
  b.classList.toggle("det",i===det&&S.lock===null);b.classList.toggle("lock",S.lock===i);b.classList.toggle("done",!!tuned[i]);});
}
function idle(){
 tgt=0;$("note").className="note idle";$("note").textContent="—";$("stat").className="stat";$("stat").textContent=running?"Listening…":"Paused";
 $("nums").innerHTML="&nbsp;";$("led").classList.remove("on");paintStrings(-1);inT=0;
}
var inT=0,vibbed=false;
function show(f,target,cents,idx,m){
 tgt=Math.max(-50,Math.min(50,cents))/50*AM;
 var n=$("note");n.className="note";n.innerHTML=NN[m%12]+"<small>"+(Math.floor(m/12)-1)+"</small>";
 var a=Math.abs(cents),st=$("stat"),ok=a<=5;
 st.className="stat "+(ok?"ok":a<=15?"warn":"bad");
 st.textContent=ok?"In tune ✓":cents<0?"Tune up ↑":"Tune down ↓";
 $("nums").textContent=f.toFixed(1)+" Hz · "+(cents>0?"+":cents<0?"−":"±")+Math.abs(cents).toFixed(0)+" cents";
 $("led").classList.toggle("on",ok);
 var now=performance.now();
 if(ok){if(!inT)inT=now;if(now-inT>600){if(idx>=0)tuned[idx]=true;if(!vibbed){vibbed=true;if(S.vib&&navigator.vibrate)try{navigator.vibrate(40)}catch(e){}}}}
 else{inT=0;vibbed=false;}
 paintStrings(idx);
}

/* ---------- pitch detection (YIN) ---------- */
var ctx,stream,an,raw,dec=new Float32Array(4096),running=false,lastDet=0,lastGood=0,hist=[];
function yin(x,fs){
 var W=2048,tMax=Math.min(2048,Math.floor(fs/27)),tMin=Math.floor(fs/1600);
 var d=new Float32Array(tMax+2),c=new Float32Array(tMax+2),s,j,t,df;
 for(t=1;t<=tMax;t++){s=0;for(j=0;j<W;j++){df=x[j]-x[j+t];s+=df*df;}d[t]=s;}
 c[0]=1;var run=0;for(t=1;t<=tMax;t++){run+=d[t];c[t]=run>0?d[t]*t/run:1;}
 var f=-1;
 for(t=tMin;t<tMax;t++){if(c[t]<.18){while(t+1<tMax&&c[t+1]<c[t])t++;f=t;break;}}
 if(f<0)return null;
 var s0=c[f-1],s1=c[f],s2=c[f+1],den=s0-2*s1+s2,sh=den?(s0-s2)/(2*den):0;
 return fs/(f+Math.max(-1,Math.min(1,sh)));
}
function median(a){var b=a.slice().sort(function(p,q){return p-q});return b[b.length>>1];}
function detectTick(t){
 if(!running||t-lastDet<50)return;lastDet=t;
 an.getFloatTimeDomainData(raw);
 var i,r=0;for(i=0;i<raw.length;i++)r+=raw[i]*raw[i];r=Math.sqrt(r/raw.length);
 var f=null;
 if(r>.008){for(i=0;i<4096;i++)dec[i]=(raw[2*i]+raw[2*i+1])/2;f=yin(dec,ctx.sampleRate/2);}
 if(!f){if(t-lastGood>700){hist=[];idle();}return;}
 lastGood=t;var L=Math.log2(f);
 if(hist.length&&Math.abs(L-median(hist))>.5/12)hist=[];
 hist.push(L);if(hist.length>5)hist.shift();
 f=Math.pow(2,median(hist));
 var A=S.a4,it=INS[S.ins],tf,idx=-1,m;
 var fm=function(m){return A*Math.pow(2,(m-69)/12)};
 if(!it.s){m=Math.round(69+12*Math.log2(f/A));tf=fm(m);}
 else{
  if(S.lock!==null&&it.s[S.lock]!==undefined)idx=S.lock;
  else{var best=1e9;it.s.forEach(function(sm,k){var e=Math.abs(Math.log2(f/fm(sm)));if(e<best){best=e;idx=k;}});}
  m=it.s[idx];tf=fm(m);
 }
 show(f,tf,1200*Math.log2(f/tf),idx,m);
}

/* ---------- audio lifecycle ---------- */
function start(){
 var p=$("ovp");p.className="";
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){p.className="err";p.textContent="This browser can’t access the microphone. Open the page in Safari or Chrome over HTTPS.";return;}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
  stream=s;var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0;raw=new Float32Array(an.fftSize);
  ctx.createMediaStreamSource(s).connect(an);ctx.resume();
  running=true;hist=[];$("ov").classList.add("hide");idle();
 }).catch(function(e){
  p.className="err";
  p.textContent=(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))?"Microphone access was denied. Allow it in your browser or device settings, then tap again.":(e&&e.name==="NotFoundError")?"No microphone found on this device.":"Couldn’t start the microphone. Try reloading the page.";
 });
}
function stop(){
 running=false;if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;
 if(ctx){try{ctx.close()}catch(e){}ctx=null;}
}
$("go").onclick=start;
document.addEventListener("visibilitychange",function(){
 if(document.hidden&&running){stop();idle();$("ovp").className="";$("ovp").textContent="The microphone was turned off while the tab was hidden.";$("go").textContent="Tap to resume";$("ov").classList.remove("hide");}
});

/* ---------- settings sheet ---------- */
function sheet(o){$("sheet").classList.toggle("show",o);$("back").classList.toggle("show",o);}
$("gear").onclick=function(){sheet(true)};$("back").onclick=$("close").onclick=function(){sheet(false)};
function sw(id,key){var e=$(id);e.setAttribute("aria-checked",S[key]);e.classList.toggle("on",S[key]);e.onclick=function(){S[key]=!S[key];e.classList.toggle("on",S[key]);e.setAttribute("aria-checked",S[key]);if(key==="auto"){if(S.auto)S.lock=null;else if(S.lock===null&&INS[S.ins].s)S.lock=0;paintStrings(-1);}save();};}
sw("swAuto","auto");sw("swVib","vib");
$("a4").value=S.a4;$("a4v").textContent=S.a4+" Hz";
$("a4").oninput=function(){S.a4=+this.value;$("a4v").textContent=S.a4+" Hz";save();};

setIns(S.ins);requestAnimationFrame(frame);
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
})();
</script>
</body>
</html>
